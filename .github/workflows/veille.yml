name: Veille Aéronautique Hebdomadaire

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Installer les dépendances
        run: npm install

      - name: Lancer le script de veille IA
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/update-news.js

      - name: Commiter et pousser les modifications sur GitHub
        run: |
          git config --global user.name "Airwatch Bot"
          git config --global user.email "actions@github.com"
          git add items.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Chore: actualisation automatique des news"
            git push
          else
            echo "Aucun changement détecté, rien à committer."
          fi